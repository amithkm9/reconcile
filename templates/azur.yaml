client: azur
language: fr
proposed_by: fallback
files:
  remittances:
    path: avis_paiement.csv
    encoding: utf-8-sig
    sep: ;
    date_format: '%d/%m/%Y'
    decimal: ','
    period_format: '%m/%Y'
    columns:
      remittance_id: N° avis
      date: Date avis
      payer_name: Payeur
      beneficiary_name: Bénéficiaire
      period: Période
      amount: Montant
      facility: Établissement
  bank:
    path: bank/releve_*.csv
    encoding: cp1252
    sep: ;
    skip_rows: 2
    skip_footer: 1
    date_format: '%d/%m/%Y'
    decimal: ','
    amount_mode: debit_credit
    columns:
      date: Date opération
      label: Libellé
      reference: Référence
      debit: Débit
      credit: Crédit
  invoices:
    path: factures.csv
    encoding: utf-8-sig
    sep: ;
    date_format: '%d/%m/%Y'
    decimal: ','
    period_format: '%m/%Y'
    columns:
      invoice_id: N° Facture
      resident_id: Code résident
      facility: Établissement
      issue_date: Date facture
      due_date: Échéance
      period: Période
      doc_type: Type
      amount: Montant TTC
      original_invoice: Facture d'origine
      resident_name:
      - Nom
      - Prénom
    values:
      doc_type:
        FACTURE: invoice
        AVOIR: credit
  payers:
    path: payeurs.csv
    encoding: utf-8-sig
    sep: ;
    date_format: '%d/%m/%Y'
    decimal: .
    columns:
      resident_id: Code résident
      payer_name: Nom payeur
      payer_type: Type payeur
      share_pct: Part %
      resident_name: Nom résident
      mandate_ref: RUM
      resident_exit_date: Date sortie
    values:
      payer_type:
        Résident: resident
        Famille: family
        Aide sociale (Département): public_aid
        Tuteur / UDAF: guardian
patterns:
  invoice: FA\d{4}\-\d{6}
  mandate: RUM\-AZ\-\d{6}
  remittance: AV\-\d{2}\-\d{4}\-\d{4}

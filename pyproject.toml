[project]
name = "reconcile"
version = "0.1.0"
description = "Bank-to-invoice matching (lettrage) and safe dunning for care-home groups, measured against exact ground truth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "streamlit>=1.35",
    "threadpoolctl>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.101",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconcile"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ARG", "RUF", "PERF", "T20"]
ignore = ["E501", "RUF005", "PERF401", "PERF403"]  # style-only loop rewrites

[tool.ruff.lint.per-file-ignores]
# command-line entry points print their results
"reconcile/pipeline.py" = ["T20"]
"reconcile/generate/__main__.py" = ["T20"]
"reconcile/mapping/onboard.py" = ["T20"]
"reconcile/hardcases.py" = ["T20"]
"reconcile/experiments.py" = ["T20"]
"reconcile/llm.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

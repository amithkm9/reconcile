[project]
name = "reconcile"
version = "0.1.0"
description = "Payment-to-invoice matching agent for care-home groups (synthetic data, measured with ground truth)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "streamlit>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconcile"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

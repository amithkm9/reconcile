stopwords: [VIR, VIREMENT, SEPA, RECU, RECUE, INST, DE, DU, LA, LE, LES, DES, ET, MOTIF, REF, PRLV,
  PRELEVEMENT, POUR, PAR, FPI, FP, BGC, BACS, BAC, PAYMENT, PMT, FROM, TO, FOR, THE, AND, FEES, FEE,
  CARE, OF, EMIS, ORDRE, REMISE, CB, CHQ, CHEQUE]

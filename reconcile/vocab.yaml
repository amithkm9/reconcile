  2: [FEVRIER, FEVR, FEV, FEBRUARY, FEB]
  3: [MARS, MAR, MARCH]
  4: [AVRIL, AVR, APRIL, APR]
  5: [MAI, MAY]
  6: [JUIN, JUNE, JUN]
  7: [JUILLET, JUIL, JULY, JUL]
  8: [AOUT, AUGUST, AUG]
  9: [SEPTEMBRE, SEPT, SEP, SEPTEMBER]

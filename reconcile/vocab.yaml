# A bank line containing one of these is income that settles no resident invoice (or an outgoing refund).
non_ar_keywords: [APA, DOTATION, INTERETS, INTERET, INTEREST, ASSURANCE, INSURANCE, SINISTRE, CLAIM,
  DEPOT, DEPOSIT, HMRC, REMB, REFUND, SUBVENTION, GRANT]
# A debit containing one of these is a returned direct debit: it re-opens the invoice.
return_keywords: [REJET, IMPAYE, UNPAID, RETURNED, RETOUR, REJECT]
